# Cloudflare Workers Configuration for VIRALKAM.COM
name = "viralkam-api"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Environment Variables
[vars]
ENVIRONMENT = "production"
SITE_NAME = "VIRALKAM.COM"
CONTACT_EMAIL = "viralkam.com@gmail.com"
CDN_DOMAIN = "vcdn.viralkam.com"

# Cloudflare D1 Serverless Database Binding
[[d1_databases]]
binding = "DB"
database_name = "viralkam-db"
database_id = "INSERT_YOUR_D1_DATABASE_ID_HERE"

# Cloudflare R2 Zero-Egress Storage Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "viralkam-videos"
preview_bucket_name = "viralkam-videos-dev"
