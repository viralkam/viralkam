# Cloudflare Workers Configuration for VIRALKAAM.COM
name = "viralkaam-api"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Environment Variables
[vars]
ENVIRONMENT = "production"
SITE_NAME = "VIRALKAAM.COM"
CONTACT_EMAIL = "viralkam.com@gmail.com"
CDN_DOMAIN = "vcdn.viralkaam.com"
ADMIN_EMAIL = "viralkam.com@gmail.com"
ADMIN_PASS = "ChangeMeInProduction"
JWT_SECRET = "change_me_to_a_random_secret_in_production"

# Cloudflare D1 Serverless Database Binding
[[d1_databases]]
binding = "DB"
database_name = "viralkam-db"
database_id = "59a4dfe3-6e6a-4d11-8a80-3defb6cfc77f"

# Cloudflare R2 Storage (Optional: uncomment after enabling R2 in Dashboard)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "viralkam-videos"
