name = "viralkam"
main = "backend/src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "VIRALKAM.COM"
CONTACT_EMAIL = "viralkam.com@gmail.com"
CDN_DOMAIN = "vcdn.viralkam.com"
ADMIN_EMAIL = "viralkam.com@gmail.com"
# Note: For production on Cloudflare, set ADMIN_PASS and JWT_SECRET securely via:
# npx wrangler secret put ADMIN_PASS
# npx wrangler secret put JWT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "viralkam-db"
database_id = "59a4dfe3-6e6a-4d11-8a80-3defb6cfc77f"

# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "viralkam-videos"

